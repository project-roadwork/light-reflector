"2025-2026 Illinois_Roadbuff (Rogue Jr) <illinois_roadbuff@proton.me>",
]

SPDX-License-Identifier = "CC-BY-SA-4.0"

# Illinois_Roadbuff's images and work under CC BY 4.0
