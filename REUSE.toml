    "NOTICE",
    "roblox-test.project.json",
    "standalone.project.json"
]
SPDX-FileCopyrightText = [
"2025-2026 Illinois_Roadbuff (Rogue Jr) <illinois_roadbuff@proton.me>",
"2025-2026 Project Roadwork and Contributors"]

SPDX-License-Identifier = "MPL-2.0"

# Illinois_Roadbuff's images and work under CC BY-SA 4.0
[[annotations]]
