path = [
    ".gitignore",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    ".forgejo/ISSUE_TEMPLATE/bug_report.md",
    ".forgejo/ISSUE_TEMPLATE/feature_request.md",
